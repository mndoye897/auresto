<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Menu Digital — Auresto</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app-shared.css" />
    <link rel="stylesheet" href="css/client.css" />
  </head>
  <body class="client-page">
    <!-- Top Bar -->
    <header class="client-topbar">
      <button type="button" class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg>
      </button>

      <div class="topbar-brand">
        <div class="brand-emblem" id="brandEmblem">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19c0-3.31 2.69-6 6-6s6 2.69 6 6"/><circle cx="12" cy="6" r="3.2"/><line x1="3" y1="19" x2="21" y2="19"/></svg>
        </div>
        <h1 id="clientName" class="brand-name">Auresto</h1>
        <p id="clientTagline" class="brand-tagline">Saveurs d'exception, moments inoubliables</p>
      </div>

      <button type="button" class="icon-btn cart-icon-btn" id="openCartBtn" aria-label="Panier">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-badge" id="topCartBadge" hidden>0</span>
      </button>
    </header>

    <!-- Hero Banner -->
    <section class="hero-banner" id="heroBanner">
      <div class="hero-banner-overlay"></div>
      <div class="hero-banner-content">
        <p class="hero-eyebrow">Bienvenue chez</p>
        <h2 id="heroTitle">Auresto</h2>
        <p id="heroSubtitle" class="hero-desc">Découvrez nos plats raffinés préparés avec passion 🤎</p>
      </div>
      <div class="hero-dots">
        <span class="hero-dot active"></span>
        <span class="hero-dot"></span>
      </div>
    </section>

    <!-- Category Icon Nav -->
    <nav class="cat-icon-nav" id="catNav"></nav>

    <!-- Main Menu Area -->
    <main class="client-main">
      <div id="menuList" class="menu-list"></div>
    </main>

    <!-- Dish Options Modal -->
    <div class="modal-backdrop" id="dishModal" hidden>
      <div class="modal-sheet">
        <button type="button" class="modal-close" id="closeDishModalBtn" aria-label="Fermer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div class="modal-img-container">
          <img id="modalDishImg" src="" alt="" />
        </div>
        <div class="modal-body">
          <h3 id="modalDishTitle">Nom du Plat</h3>
          <p id="modalDishDesc" class="modal-desc">Description du plat</p>
          
          <div class="modal-options-section" id="modalOptionsSection">
            <!-- Options dynamically rendered here -->
          </div>

          <div class="modal-note-section">
            <label for="modalDishNote">Remarques ou instructions spéciales :</label>
            <textarea id="modalDishNote" placeholder="Ex: Sans piment, sauce à part, bien cuit..."></textarea>
          </div>

          <div class="modal-action-bar">
            <div class="modal-qty">
              <button type="button" id="modalQtyMinus">−</button>
              <span id="modalQtyVal">1</span>
              <button type="button" id="modalQtyPlus">+</button>
            </div>
            <button type="button" class="btn-primary-add" id="modalAddToCartBtn">
              Ajouter • <span id="modalTotalPrice">0 FCFA</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Floating Cart Bar -->
    <div class="cart-floating-bar" id="cartBar" hidden>
      <button type="button" class="cart-summary-row" id="cartSummaryToggle">
        <span class="cart-bag-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-bag-badge" id="cartCount">0</span>
        </span>
        <span class="cart-summary-text">
          <strong>Votre commande</strong>
          <small id="cartArticles">0 article</small>
        </span>
        <span class="cart-summary-total" id="cartTotal">0 FCFA</span>
        <span class="cart-chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </span>
      </button>
      <button type="button" class="cart-validate-btn" id="validateOrderBtn">
        Valider ma commande
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Cart Drawer & Checkout Sheet -->
    <div class="cart-panel" id="cartPanel">
      <div class="cart-sheet">
        <div class="cart-sheet-header">
          <h2 style="display:inline-flex;align-items:center;gap:8px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Votre Commande
          </h2>
          <span class="table-tag" id="cartSheetTableTag">Table —</span>
          <button type="button" class="cart-close-x" id="cartSheetCloseBtn" aria-label="Fermer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <div id="cartContent" class="cart-body"></div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="js/icons.js"></script>
    <script src="js/api-config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/dish-images.js"></script>
    <script src="js/client.js"></script>
  </body>
</html>
