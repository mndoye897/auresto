<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paramètres — Auresto</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app-shared.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body class="settings-page">
    <header class="app-header" style="background:#fff;border-color:rgba(10,59,75,.1)">
      <a class="logo" href="dashboard.html" style="color:#103b4b"><span class="logo-mark" style="border-color:#103b4b;color:#103b4b">a<span>•</span></span><strong>Auresto</strong></a>
      <nav class="app-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="kitchen.html">Cuisine</a>
        <a href="settings.html" class="active">Paramètres</a>
      </nav>
    </header>

    <main class="settings-main">
      <h1>Paramètres</h1>

      <section class="settings-section">
        <h2>Restaurant</h2>
        <div class="field"><label for="sName">Nom</label><input id="sName" type="text" /></div>
        <div class="field"><label for="sAddress">Adresse</label><input id="sAddress" type="text" /></div>
        <div class="field full">
          <label>Horaires d'ouverture</label>
          <div class="hours-presets">
            <button type="button" class="hours-preset-btn active" data-hours-preset="everyday">Tous les jours</button>
            <button type="button" class="hours-preset-btn" data-hours-preset="weekdays">Lun – Sam</button>
            <button type="button" class="hours-preset-btn" data-hours-preset="lunch">Midi uniquement</button>
            <button type="button" class="hours-preset-btn" data-hours-preset="dinner">Soir uniquement</button>
          </div>
          <div class="hours-grid" id="settingsHoursGrid"></div>
          <p class="hours-summary" id="settingsHoursSummary"></p>
        </div>
        <div class="field"><label for="sDesc">Description</label><textarea id="sDesc"></textarea></div>
      </section>

      <section class="settings-section">
        <h2>Identité visuelle</h2>
        <div class="field"><label for="sColorPrimary">Couleur principale</label><input id="sColorPrimary" type="color" /></div>
        <div class="field"><label for="sColorAccent">Couleur accent</label><input id="sColorAccent" type="color" /></div>
      </section>

      <section class="settings-section">
        <h2>Tables</h2>
        <p style="font-size:12px;color:#536a70;margin:0 0 12px" id="tableCount">0 tables configurées</p>
        <a href="onboarding.html" class="btn btn-ghost" style="color:#103b4b;border-color:rgba(10,59,75,.2)">Gérer les tables</a>
      </section>

      <section class="settings-section">
        <h2>QR codes</h2>
        <div class="field"><label for="sQrHeader">En-tête du QR</label><input id="sQrHeader" type="text" placeholder="Table {name}" /></div>
        <div class="field"><label for="sQrFooter">Texte du bas</label><input id="sQrFooter" type="text" placeholder="Scannez pour commander" /></div>
        <div class="field"><label for="sQrLayout">Format d'impression</label><select id="sQrLayout"><option value="chevalet">Chevalet de table</option><option value="autocollant">Autocollants</option><option value="affiche">Affiche</option></select></div>
        <div class="field" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
          <button type="button" class="btn btn-ghost" id="downloadQrPdfBtn" style="display:inline-flex;align-items:center;gap:6px">
            <svg class="lucide lucide-download" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg> Télécharger PDF
          </button>
          <button type="button" class="btn btn-ghost" id="downloadQrWordBtn" style="display:inline-flex;align-items:center;gap:6px">
            <svg class="lucide lucide-file-text" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg> Télécharger Word
          </button>
        </div>
      </section>

      <section class="settings-section">
        <h2>Abonnement Auresto</h2>
        <p>Offre actuelle : <span class="plan-badge" id="currentPlan">Free</span></p>
        <p style="font-size:12px;color:#536a70" id="settingsSubDetails">Passez à Silver pour activer les commandes et paiements, ou Gold pour les analyses IA.</p>
        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
          <a href="onboarding.html?plan=Silver" class="btn btn-ghost" style="color:#103b4b;border-color:rgba(10,59,75,.2)">Changer d'offre</a>
          <button type="button" class="btn btn-primary" id="settingsRenewBtn" style="display:inline-flex;align-items:center;gap:8px">
            <svg class="lucide lucide-credit-card" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg> Renouveler mon abonnement
          </button>
        </div>
      </section>

      <section class="settings-section">
        <h2>Compte</h2>
        <div class="field"><label for="sEmail">Email</label><input id="sEmail" type="email" readonly /></div>
        <button type="button" class="btn btn-ghost" style="color:#e86b6b;border-color:#e86b6b;margin-top:8px" id="resetBtn">Réinitialiser le compte</button>
      </section>

      <button type="button" class="btn btn-primary" id="saveBtn">Enregistrer</button>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/store.js"></script>
    <script src="js/hours-picker.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
